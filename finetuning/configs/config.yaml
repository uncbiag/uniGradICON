experiment:
  name: "example_experiment"
  model: "unigradicon"
  weights_path: "../network_weights/unigradicon1.0/Step_2_final.trch"

training:
  batch_size: 4
  gpus: [0]
  epochs: 100
  eval_period: 10
  save_period: 50
  learning_rate: 0.00005
  input_shape: [175, 175, 175]
  similarity: "lncc"
  lambda: 1.5
  lncc_sigma: 5

datasets:
  - name: "example_dataset"
    type: "unpaired"
    json_file: "configs/example_unpaired.json"
    weight: 1.0 # Weights must sum to 1.0
    is_ct: false
    quantile_range: [0.01, 0.99]

  # Example of adding a second dataset (ensure weights sum to 1.0):
