experiment:
  name: "l2r_abdomenmrct"
  model_weights: "multigradicon"

training:
  batch_size: 2
  gpus: [0]
  epochs: 100
  eval_period: 10
  save_period: 50
  learning_rate: 0.00005
  input_shape: [175, 175, 175]
  similarity: "lncc2"
  lambda: 1.5
  lncc_sigma: 5
  dice_loss_weight: 0.5

datasets:
  - name: "abdomen_mrct"
    type: "unpaired"
    json_file: "l2r_abdomenmrct.json"
    weight: 1.0
